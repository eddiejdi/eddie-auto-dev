[Unit]
# postgresql.service nao existe neste host (Postgres roda via container eddie-postgres.service).
# Sem isso, o gateway tentava conectar antes do container estar pronto e batia no
# StartLimitBurst padrao, ficando 'failed' permanentemente (foi o que quebrou os
# botoes de aprovacao do Telegram em 2026-08-10).
After=eddie-postgres.service
Requires=eddie-postgres.service
# Da mais folga ao burst para tolerar reinicios do host/containers
StartLimitBurst=20
StartLimitIntervalSec=300

[Service]
# Espera ativa simples pelo Postgres antes de iniciar o processo Python,
# evitando esgotar o StartLimitBurst em reboots onde o container demora a subir.
ExecStartPre=/bin/sh -c 'for i in $(seq 1 30); do pg_isready -h 192.168.15.2 -p 5433 -q && exit 0; sleep 2; done; exit 1'