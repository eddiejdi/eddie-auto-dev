[Service]
# TEMPLATE — este arquivo NÃO é instalado por nenhum deploy automático
# (não está em deploy/systemd-dropins-sync.allowlist). Contém placeholders de
# segredo; existe só como documentação de recuperação — o arquivo real vive
# só no host, criado à mão em algum momento e nunca commitado até hoje.
#
# Descoberto 2026-07-27 investigando por que o bot respondia "Erro: 404" a
# mensagens reais (ver PR #262): OLLAMA_HOST aqui é quem decide para onde o
# bot chama, sobrescrevendo o default do código (scripts/misc/whatsapp_bot.py).
Environment=WAHA_URL=http://localhost:3001
Environment=WAHA_API_KEY=<from_bitwarden>

# Persona/WhatsApp LLM na RTX 2060 SUPER do NAS (evita 503 da 3060 ocupada
# pelo trading) — decisão deliberada, não mudar sem avaliar contenção de GPU.
Environment=OLLAMA_HOST=http://192.168.15.4:11436

# Personas (lidas por scripts/misc/whatsapp_bot.py desde o restore NSFW 2026-07-30):
#   PERSONA_MODE=auto  → eddie-persona-free só na allowlist NSFW_FREE_CONTACTS
#   PERSONA_MODE=free  → free global (não recomendado)
#   PERSONA_MODE=safe  → always eddie-persona-safe
# PHONE_MODEL_MAPPING ainda mapeia o dono para shared-homelab (tools), mas a
# allowlist NSFW tem prioridade sobre esse mapa.
Environment=OLLAMA_MODEL=shared-coder
Environment=PERSONA_MODEL_SAFE=eddie-persona-safe
Environment=PERSONA_MODEL_FREE=eddie-persona-free
Environment=PERSONA_MODE=auto

# Tolerância a demora da GPU/NAS (cold load 8B na 2060):
# timeout de leitura 300s + até 5 retries com backoff em timeout/5xx.
Environment=OLLAMA_HTTP_TIMEOUT=300
Environment=OLLAMA_HTTP_CONNECT_TIMEOUT=30
Environment=OLLAMA_HTTP_RETRIES=5
Environment=OLLAMA_HTTP_RETRY_BACKOFF=3
Environment=OLLAMA_KEEP_ALIVE=60m
Environment=OLLAMA_NUM_PREDICT=384

# Números de contato — dados pessoais, nunca reais neste template.
# No host: inclua telefone/JID/LID dos contatos com NSFW liberado (hardcore).
# Sem isso, o bot cai no modelo com censura (persona-safe / shared-*).
Environment="NSFW_FREE_CONTACTS=<phone_number_1>,<phone_number_2>,..."
Environment=ALLOWED_NUMBERS=<phone_number_1>,<phone_number_2>,...
Environment=OWNER_ONLY=true

Environment=SECRETS_AGENT_URL=http://localhost:8088
Environment=SECRETS_AGENT_API_KEY=<from_bitwarden>
# DSN completo resolvido via Secrets Agent (schema btc, host localhost,
# porta 5433) — nunca escrever usuário/senha diretamente neste arquivo.
Environment=DATABASE_URL=<from_secrets_agent>

# Necessárias a partir do fine-tune de tool-calling (mcp_tool_bridge.py
# importa scripts/homelab_mcp_server.py em processo — sem essas vars os
# tools bus_*/api_* falham silenciosamente ao resolver a URL errada).
# Ver docs/variables-taxonomy/HOMELAB_URL.md e API_BASE_URL.md.
# TRADING_DATABASE_URL NÃO é necessária aqui: o mesmo Postgres da porta 5433
# hospeda o schema btc.* junto do schema public (ver comentário acima em
# DATABASE_URL) — homelab_mcp_server.py::_get_trading_db_url() já cai de
# volta pra DATABASE_URL quando TRADING_DATABASE_URL não está setada.
Environment=HOMELAB_URL=http://localhost:8503
Environment=API_BASE_URL=http://localhost:3000
