# Diretórios de drop-in systemd gerenciados pelo deploy do trading
# (scripts/deploy_btc_trading_profiles.sh → homelab 192.168.15.2).
#
# Cada linha é um diretório <unit>.service.d / <unit>.timer.d relativo a
# systemd/ neste repo. Todo *.conf dentro dele é instalado em
# /etc/systemd/system/<diretório>/ de forma ADITIVA (nunca com --delete:
# o host tem drop-ins vivos que ainda não estão versionados).
#
# Fonte única de verdade compartilhada por:
#   - scripts/deploy_btc_trading_profiles.sh   (instalação)
#   - scripts/check_systemd_dropin_drift.py    (verificação de divergência)
#   - tests/test_systemd_dropin_parity.py      (invariantes)
#
# Escopo deliberadamente restrito à pilha trading/Ollama do homelab. Os demais
# *.service.d deste repo (ltfs-*, nextcloud-tape-backup, nvme-tape-drain,
# lto6-drain-backups, wg-quick@protonvpn, cloudflared-rpa4all, akash-sweep,
# coordinator-agent) pertencem a outros hosts (NAS 192.168.15.4) ou a outros
# pipelines — ver docs/systemd/DROPIN_DEPLOY_PARITY.md.

crypto-agent@.service.d
crypto-agent@BTC_USDT_aggressive.service.d
crypto-agent@BTC_USDT_conservative.service.d
ollama.service.d
ollama-gpu1.service.d
ollama-gpu-coordinator.service.d
