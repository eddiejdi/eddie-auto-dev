[Service]
# NUM_PARALLEL=1: 1 slot por modelo → KV cache sem conflito com phi4-mini:latest simultaneamente carregado
# trading-analyst(5511MB) + phi4-mini:latest(~1400MB) + KV=2x → OOM em 8GB; 1x → seguro
# Segundo agente simultâneo cai em queue (MAX_QUEUE=4) ou fallback GPU1 via coordenador
Environment=OLLAMA_NUM_PARALLEL=1
Environment=OLLAMA_MAX_QUEUE=4
