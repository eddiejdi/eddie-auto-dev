[Service]
# Pre-warm libggml-cuda.so (1.6GB) na page cache ANTES do discovery subprocess
# Sem isso, o discovery timeout de 30s expira enquanto o kernel lê 1.6GB do disco
# Especialmente crítico no boot com rsync/RAID em andamento
ExecStartPre=/bin/bash -c 'cat /usr/local/lib/ollama/cuda_v12/libggml-cuda.so > /dev/null 2>&1 && echo "ollama: libggml-cuda.so pre-warmed" || echo "ollama: pre-warm falhou (ignorado)"'
