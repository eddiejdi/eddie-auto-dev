[Service]
Environment=OLLAMA_PRELOAD_MODEL=trading-analyst:latest
ExecStartPost=
ExecStartPost=/bin/bash -lc 'set -euo pipefail; sleep 10; curl -sf http://127.0.0.1:11434/api/tags | grep -F -- "${OLLAMA_PRELOAD_MODEL}" >/dev/null; OLLAMA_HOST=http://127.0.0.1:11434 /usr/local/bin/ollama run "${OLLAMA_PRELOAD_MODEL}" "" >/dev/null'
