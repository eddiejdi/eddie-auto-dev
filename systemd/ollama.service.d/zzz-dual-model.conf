[Service]
# 2026-09-10: warmup de trading-analyst:latest removido — o analyst reside no NAS
# (:11436) desde 2026-08-12 (DECISION_TRADING_ANALYST_NAS). A 3060 só carrega
# trading-* durante o retreino agendado (weekly-retrain.timer, 00:00 BRT).
Environment=OLLAMA_MAX_LOADED_MODELS=2

# Sobrescreve warmup anterior — carrega apenas phi4-mini (agent) na inicialização
ExecStartPost=
ExecStartPost=/bin/bash -lc 'sleep 2 && OLLAMA_HOST=http://127.0.0.1:11434 /usr/local/bin/ollama run phi4-mini:latest "" >/dev/null 2>&1 && echo "ollama: phi4-mini:latest warm" || echo "ollama: phi4-mini:latest warmup falhou"'
