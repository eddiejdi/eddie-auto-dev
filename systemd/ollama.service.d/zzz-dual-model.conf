[Service]
# Dois modelos simultâneos na GPU0: trading-analyst (llama3.1:8b) + phi4-mini:latest (agent)
# VRAM estimada: ~5.35GB + ~1.40GB = ~6.75GB (folga de ~1.25GB nos 8GB)
Environment=OLLAMA_MAX_LOADED_MODELS=2

# Sobrescreve warmup anterior — carrega ambos os modelos na inicialização
ExecStartPost=
ExecStartPost=/bin/bash -lc 'sleep 10 && OLLAMA_HOST=http://127.0.0.1:11434 /usr/local/bin/ollama run trading-analyst:latest "" >/dev/null 2>&1 && echo "ollama: trading-analyst warm" || echo "ollama: trading-analyst warmup falhou"'
ExecStartPost=/bin/bash -lc 'sleep 2 && OLLAMA_HOST=http://127.0.0.1:11434 /usr/local/bin/ollama run phi4-mini:latest "" >/dev/null 2>&1 && echo "ollama: phi4-mini:latest warm" || echo "ollama: phi4-mini:latest warmup falhou"'
