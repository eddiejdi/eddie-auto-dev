[Service]
# RTX3060 12GB suporta 3 modelos simultaneos:
# trading-analyst (~9274MB) + gemma3:1b (~702MB) + gemma3-fast:gpu1 (~1449MB) = ~11425MB
# Sobra ~863MB (overhead de 512MB reservado em ollama-optimized.conf) - sem espaco seguro para um 4o modelo
Environment=OLLAMA_MAX_LOADED_MODELS=3

# Warmup via REST API (nao usa 'ollama run' - bloqueado pelo hook de seguranca)
ExecStartPost=
ExecStartPost=/bin/bash -lc 'sleep 15 && curl -s --max-time 300 http://127.0.0.1:11434/api/generate -d "{\"model\":\"trading-analyst:latest\",\"prompt\":\"warmup\",\"stream\":false,\"keep_alive\":-1}" > /dev/null 2>&1 || true'
