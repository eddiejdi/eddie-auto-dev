[Service]
# 2026-09-10: warmup de trading-analyst:latest na GPU0 REMOVIDO — o analyst reside
# no NAS (:11436) desde 2026-08-12 (DECISION_TRADING_ANALYST_NAS). A 3060 só deve
# carregar trading-* durante o retreino agendado (weekly-retrain.timer, 00:00 BRT).
# MAX_LOADED_MODELS efetivo é definido por zzzzz-idle-power-final.conf (=1) ou
# zzzzzz-trading-plus-aux.conf (host, =2) — nunca pelo valor abaixo.
Environment=OLLAMA_MAX_LOADED_MODELS=3

# Warmup de phi4-mini (agent) mantido, agora via REST API.
ExecStartPost=
ExecStartPost=/bin/bash -lc 'sleep 15 && curl -s --max-time 300 http://127.0.0.1:11434/api/generate -d "{\"model\":\"phi4-mini:latest\",\"prompt\":\"warmup\",\"stream\":false,\"keep_alive\":\"10m\"}" > /dev/null 2>&1 || true'
