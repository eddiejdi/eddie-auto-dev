[Service]
# O token do Home Assistant NÃO fica neste arquivo — ele é versionado num repo
# público. Até 2026-07-28 um token long-lived válido esteve aqui em claro desde
# 2026-02-23. Ver docs/INCIDENTS/2026-07-28_SECRETS_IN_PUBLIC_REPO.md.
#
# O arquivo abaixo é gerado no host (fora do git) a partir do Secrets Agent por
# tools/systemd/install_tray_always_on.sh, que resolve o secret
# 'eddie/home_assistant_token' (campo password).
#
# O '-' faz o systemd tolerar a ausência do arquivo: a unit sobe e falha na
# chamada ao HA com erro claro, em vez de travar em start failure.
EnvironmentFile=-/etc/eddie/home-assistant.env
Environment="HOME_ASSISTANT_URL=http://192.168.15.2:8123"
